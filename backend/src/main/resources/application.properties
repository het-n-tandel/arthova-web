spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/ledger
spring.datasource.username=ledger
spring.datasource.password=ledger
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# We set this to 'validate' to ensure our JPA Entities map perfectly to Drizzle's tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080
