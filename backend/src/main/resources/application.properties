spring.application.name=backend

# Database Configuration
# Cloud & Local Dynamic Binding: Supports Neon, Render, Supabase via Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000

# JPA Configuration
# Set to 'validate' to verify against Drizzle ORM schema; override with SPRING_JPA_HIBERNATE_DDL_AUTO if needed
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server & Dynamic Cloud Port (Render passes dynamic $PORT, defaults to 8080)
server.port=${PORT:8080}

# Security Configuration: Internal Gateway Secret & Origins
internal.api.secret=${INTERNAL_API_SECRET}
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
