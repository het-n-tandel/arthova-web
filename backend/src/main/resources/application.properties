spring.application.name=backend

# Database Configuration
# Cloud & Local Dynamic Binding: Supports Neon, Render, Supabase via Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ledger}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ledger}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ledger}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Set to 'validate' to verify against Drizzle ORM schema; override with SPRING_JPA_HIBERNATE_DDL_AUTO if needed
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server & Dynamic Cloud Port (Render passes dynamic $PORT, defaults to 8080)
server.port=${PORT:8080}
